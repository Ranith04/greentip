services:
  db:
    image: mysql:5.7
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: greentip-new
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8 --collation-server=utf8_general_ci
    volumes:
      - greentip-mysql:/var/lib/mysql
      - ./greentip.sql:/docker-entrypoint-initdb.d/01-greentip.sql:ro

  web:
    build:
      context: .
      dockerfile: Dockerfile.preview
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html/greentip_live
    environment:
      DB_HOSTNAME: db
      CI_ENV: development
    depends_on:
      - db

volumes:
  greentip-mysql:
