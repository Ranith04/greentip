services:
  mysql:
    image: mysql:8.0
    container_name: greentip_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: greentip
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./GreenTIP-webportalcode/GreenTIP-webportalcode/greentip.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greentip_backend
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=greentip;User=root;Password=root_password;"
      Jwt__Secret: "GreenTIP_Enterprise_Regulatory_Portal_Super_Secret_Key_2026_Minimum_32_Bytes"
      Jwt__Issuer: "GreenTIP"
      Jwt__Audience: "GreenTIP_Mobile_Clients"
    depends_on:
      - mysql

volumes:
  mysql_data:
